[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beets-artistcountry"
version = "1.0.0"
authors = [
  {name = "Arnaud Grausem", email = "arnaud.grausem@gmail.com"},
]
description = "Beets plugin to retrieve the country of an artist from musicbrainz"
readme = "README.rst"
license = "MIT"
keywords = ["beets", "music", "collection", "musicbrainz", "country", "artist"]

classifiers = [
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

requires-python = ">=3.8"
dependencies = [
  "beets>=1.6.0",
  "musicbrainzngs"
]


[project.urls]
Repository = "https://github.com/agrausem/beets-artistcountry"

[tool.hatch.build.targets.wheel]
packages = ["beetsplug"]

[tool.hatch.build.targets.sdist]
include = [
    "beetsplug/"
]
